{% extends "base.html" %}
{% block title %}Register — TiffinBox{% endblock %}

{% block content %}
<div class="container">
    <div class="card shadow-lg mx-auto" style="max-width:500px; margin-top:60px; border-radius:20px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <div style="font-size:3rem">🍱</div>
                <h3 class="fw-bold mt-2">Create Account</h3>
                <p class="text-muted">Join TiffinBox today</p>
            </div>

            <form id="register-form">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Full Name</label>
                    <input type="text" id="full_name" class="form-control"
                           placeholder="Your full name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email Address</label>
                    <input type="email" id="email" class="form-control"
                           placeholder="you@example.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Phone Number</label>
                    <input type="tel" id="phone" class="form-control"
                           placeholder="10-digit mobile number"
                           pattern="[0-9]{10}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Delivery Address</label>
                    <textarea id="address" class="form-control" rows="2"
                              placeholder="Your full address"></textarea>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" id="password" class="form-control"
                           placeholder="Min 6 characters" minlength="6" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fs-5" id="reg-btn">
                    Create Account
                </button>
            </form>

            <p class="text-center mt-4 text-muted">
                Already have an account?
                <a href="/login" class="text-primary fw-semibold">Login here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('reg-btn');
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating...';
    btn.disabled  = true;

    try {
        await apiRequest('/auth/register', 'POST', {
            full_name: document.getElementById('full_name').value,
            email:     document.getElementById('email').value,
            phone:     document.getElementById('phone').value,
            address:   document.getElementById('address').value,
            password:  document.getElementById('password').value
        });

        showToast('Account created! Please login.', 'success');
        setTimeout(() => window.location.href = '/login', 1500);

    } catch (err) {
        showToast(err.message || 'Registration failed', 'danger');
        btn.innerHTML = 'Create Account';
        btn.disabled  = false;
    }
});
</script>
{% endblock %}
