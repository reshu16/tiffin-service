{% extends "base.html" %}
{% block title %}Subscription Plans — TiffinBox{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="text-center mb-5">
        <h2 class="fw-bold">Choose Your Plan</h2>
        <p class="text-muted">Flexible subscription plans to suit your lifestyle</p>
    </div>
    <div class="row g-4 justify-content-center" id="plans-grid">
        <div class="col-12 text-center py-5">
            <div class="spinner-border text-primary"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function loadPlans() {
    try {
        const data = await apiRequest('/subscription/plans');
        const el   = document.getElementById('plans-grid');
        el.innerHTML = data.plans.map((plan, i) => `
            <div class="col-md-3">
                <div class="card shadow text-center p-4 h-100 ${i===2?'border-primary border-2':''}">
                    ${i===2?'<span class="badge bg-primary mb-2 px-3 py-2">Most Popular</span>':''}
                    <div style="font-size:2.5rem" class="mb-2">
                        ${plan.duration==='daily'?'🌅':plan.duration==='weekly'?'📅':'🗓️'}
                    </div>
                    <h4 class="fw-bold">${plan.plan_name}</h4>
                    <div class="display-5 fw-bold text-primary my-3">
                        ${formatRupee(plan.price)}
                    </div>
                    <p class="text-muted">${plan.description || ''}</p>
                    <ul class="list-unstyled text-start my-3">
                        <li class="mb-2"><i class="bi bi-check-circle-fill text-success me-2"></i>
                            ${plan.meals_per_day} meal(s) per day</li>
                        <li class="mb-2"><i class="bi bi-check-circle-fill text-success me-2"></i>
                            Free delivery</li>
                        <li class="mb-2"><i class="bi bi-check-circle-fill text-success me-2"></i>
                            Pause or cancel anytime</li>
                        <li class="mb-2"><i class="bi bi-check-circle-fill text-success me-2"></i>
                            Fresh daily meals</li>
                    </ul>
                    <button class="btn btn-primary mt-auto w-100 py-2 fw-semibold"
                            onclick="subscribe(${plan.plan_id}, '${plan.plan_name}')">
                        Subscribe Now
                    </button>
                </div>
            </div>`).join('');
    } catch (e) {
        document.getElementById('plans-grid').innerHTML =
            '<p class="text-center text-muted">Could not load plans.</p>';
    }
}

async function subscribe(planId, planName) {
    if (!isLogged()) {
        showToast('Please login to subscribe', 'warning');
        setTimeout(() => window.location.href = '/login', 1000);
        return;
    }
    if (!confirm(`Subscribe to ${planName}?`)) return;
    try {
        await apiRequest('/subscription/subscribe', 'POST', { plan_id: planId }, true);
        showToast('Subscribed successfully! 🎉', 'success');
        setTimeout(() => window.location.href = '/dashboard', 1500);
    } catch (e) { showToast(e.message, 'danger'); }
}

loadPlans();
</script>
{% endblock %}
