{% extends "base.html" %}
{% block title %}Kitchen Dashboard — TiffinBox{% endblock %}
{% block navbar %}{% endblock %}

{% block content %}
<div class="d-flex">
    <div class="sidebar d-flex flex-column p-3" style="width:220px;min-width:220px">
        <div class="text-white text-center py-3 mb-3">
            <div style="font-size:2rem">👨‍🍳</div>
            <div class="fw-bold">Kitchen Panel</div>
        </div>
        <nav class="nav flex-column gap-1">
            <a class="nav-link active" href="/kitchen/dashboard">
                <i class="bi bi-house me-2"></i>Today's Orders</a>
            <a class="nav-link" href="#" onclick="loadAllKitchenOrders()">
                <i class="bi bi-list me-2"></i>All Orders</a>
        </nav>
        <div class="mt-auto">
            <a class="nav-link text-danger" href="#" onclick="logout()">
                <i class="bi bi-box-arrow-right me-2"></i>Logout</a>
        </div>
    </div>

    <div class="flex-grow-1 p-4" style="background:#f8f9fa;min-height:100vh">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold mb-0">Today's Orders</h4>
                <p class="text-muted small mb-0" id="today-date"></p>
            </div>
            <button class="btn btn-outline-primary btn-sm" onclick="loadTodayOrders()">
                <i class="bi bi-arrow-clockwise me-1"></i>Refresh
            </button>
        </div>

        <!-- Summary pills -->
        <div class="d-flex gap-3 flex-wrap mb-4" id="kitchen-summary"></div>

        <!-- Orders Grid -->
        <div class="row g-3" id="kitchen-orders"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
if (!isLogged() || !['kitchen','admin'].includes(getUser()?.role))
    window.location.href = '/login';

document.getElementById('today-date').textContent =
    new Date().toLocaleDateString('en-IN', { weekday:'long', day:'numeric',
                                             month:'long', year:'numeric' });

async function loadTodayOrders() {
    try {
        const data   = await apiRequest('/orders/today', 'GET', null, true);
        const orders = data.orders;
        const el     = document.getElementById('kitchen-orders');
        const summary= document.getElementById('kitchen-summary');

        // Summary pills
        const counts = {};
        orders.forEach(o => counts[o.status] = (counts[o.status]||0)+1);
        summary.innerHTML = `
            <span class="badge bg-primary px-3 py-2 fs-6">Total: ${orders.length}</span>
            ${Object.entries(counts).map(([s,c]) =>
                `<span class="badge status-${s} px-3 py-2 fs-6">${s}: ${c}</span>`
            ).join('')}`;

        if (!orders.length) {
            el.innerHTML = `<div class="col-12 text-center py-5 text-muted">
                <i class="bi bi-inbox" style="font-size:4rem"></i>
                <p class="mt-3">No orders today yet</p></div>`;
            return;
        }

        el.innerHTML = orders.map(order => `
            <div class="col-md-4">
                <div class="card shadow-sm p-3 h-100">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <span class="fw-bold text-primary fs-5">#${order.order_id}</span>
                        ${statusBadge(order.status)}
                    </div>
                    <div class="mb-2">
                        ${order.items?.map(i =>
                            `<div class="d-flex justify-content-between small py-1 border-bottom">
                                <span>${i.item_name}</span>
                                <span class="badge bg-primary">×${i.quantity}</span>
                            </div>`
                        ).join('') || ''}
                    </div>
                    <div class="text-muted small mb-3">
                        <i class="bi bi-geo-alt me-1"></i>${order.delivery_address}<br>
                        ${order.special_notes ?
                            `<i class="bi bi-chat-left-text me-1"></i>${order.special_notes}` : ''}
                    </div>
                    <div class="mt-auto">
                        ${order.status === 'confirmed' ? `
                        <button class="btn btn-warning w-100 btn-sm"
                                onclick="updateStatus(${order.order_id},'preparing')">
                            <i class="bi bi-fire me-1"></i>Start Preparing
                        </button>` : ''}
                        ${order.status === 'preparing' ? `
                        <button class="btn btn-success w-100 btn-sm"
                                onclick="updateStatus(${order.order_id},'out_for_delivery')">
                            <i class="bi bi-truck me-1"></i>Ready for Delivery
                        </button>` : ''}
                        ${order.status === 'pending' ? `
                        <button class="btn btn-primary w-100 btn-sm"
                                onclick="updateStatus(${order.order_id},'confirmed')">
                            <i class="bi bi-check me-1"></i>Confirm Order
                        </button>` : ''}
                    </div>
                </div>
            </div>`).join('');
    } catch (e) { showToast('Could not load orders', 'danger'); }
}

async function updateStatus(orderId, status) {
    try {
        await apiRequest(`/orders/${orderId}/status`, 'PUT', { status }, true);
        showToast(`Order #${orderId} → ${status}`, 'success');
        loadTodayOrders();
    } catch (e) { showToast(e.message, 'danger'); }
}

loadTodayOrders();
setInterval(loadTodayOrders, 30000); // Auto-refresh every 30 seconds
</script>
{% endblock %}
